<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinema | miguel e francis</title>
<link rel="icon" type="image/png" href="img/cinema-removebg-preview.png">   
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,480&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="ambient" aria-hidden="true">
  <span class="blob b1"></span>
  <span class="blob b2"></span>
  <span class="blob b3"></span>
  <span class="blob b4"></span>
</div>

<!-- ---------- login ---------- -->
<div id="loginScreen" class="screen login-screen">
  <div class="card login-card">
    <span class="eyebrow">cinema do xuxu</span>
    <h1>Fran-mig<span class="dot">.</span></h1>
    <label class="field">
      <span>E-mail</span>
      <input type="email" id="loginEmail" autocomplete="username">
    </label>
    <label class="field">
      <span>Senha</span>
      <input type="password" id="loginPassword" autocomplete="current-password">
    </label>
    <button class="btn btn-primary" id="btnLogin">Entrar</button>
    <p class="login-error" id="loginError"></p>
  </div>
</div>

<!-- ---------- app ---------- -->
<div id="appScreen" class="screen app-screen hidden">

  <nav class="sidebar" id="sidebar">
    <div class="sidebar-dots" aria-hidden="true">
      <span class="dot-light r"></span>
      <span class="dot-light y"></span>
      <span class="dot-light g"></span>
    </div>

    <div class="sidebar-divider"></div>

    <div class="sidebar-group">
      <button class="side-btn" id="navRoom" data-panel="room" type="button" aria-label="Sala">
        <span class="icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8.5" cy="12" r="5"/><circle cx="15.5" cy="12" r="5"/></svg>
          <span class="side-dot" id="statusDot"></span>
        </span>
        <span class="side-label">Sala</span>
      </button>

      <button class="side-btn" id="navMode" data-panel="mode" type="button" aria-label="Modo">
        <span class="icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"/><circle cx="9" cy="7" r="2" fill="currentColor" stroke="none"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="15" cy="17" r="2" fill="currentColor" stroke="none"/></svg>
        </span>
        <span class="side-label">Modo</span>
      </button>

      <button class="side-btn" id="navLoad" data-panel="load" type="button" aria-label="Filme">
        <span class="icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10.5 9.2v5.6l4.5-2.8z" fill="currentColor" stroke="none"/></svg>
        </span>
        <span class="side-label">Filme</span>
      </button>
    </div>

    <div class="sidebar-divider"></div>
    <div class="sidebar-spacer"></div>

    <button class="side-btn account-btn" id="navAccount" data-panel="account" type="button" aria-label="Conta">
      <span class="avatar-circle">Fm</span>
      <span class="side-label">Conta</span>
    </button>
  </nav>

  <!-- ---------- flyouts ---------- -->
  <div class="flyout-backdrop" id="flyoutBackdrop"></div>

  <div class="flyout" id="flyoutRoom">
    <span class="flyout-title">Sala</span>
    <div class="thread" aria-hidden="true">
      <span class="node" id="nodeMe"></span>
      <span class="thread-line" id="threadLine"></span>
      <span class="node" id="nodeOther"></span>
    </div>
    <div class="flyout-row">
      <input type="text" id="roomCode" placeholder="código da sala" maxlength="20">
      <button class="btn btn-primary" id="btnJoin">Entrar</button>
    </div>
    <p class="flyout-hint" id="statusText">Fora de uma sala</p>
  </div>

  <div class="flyout" id="flyoutMode">
    <span class="flyout-title">Modo</span>
    <div class="segmented" id="modeSegmented">
      <button class="segment active" data-value="each" type="button">Cada um com o arquivo</button>
      <button class="segment" data-value="stream" type="button">Transmissão ao vivo</button>
    </div>
    <div class="segmented hidden" id="roleSegmented">
      <button class="segment active" data-value="host" type="button">Eu tenho o filme</button>
      <button class="segment" data-value="guest" type="button">Vou receber</button>
    </div>
    <p class="flyout-hint" id="modeHint">Os dois precisam ter o mesmo filme salvo — só o play, a pausa e o tempo são sincronizados.</p>
  </div>

  <div class="flyout" id="flyoutLoad">
    <span class="flyout-title">Filme</span>
    <label class="file-btn" id="btnVideo">
      <span id="labelVideo">Escolher filme</span>
      <input type="file" id="inputVideo" accept="video/*">
    </label>
    <div class="flyout-row">
      <input type="text" class="url-input" id="urlInput" placeholder="ou cole um link direto (.mp4)">
      <button class="btn btn-ghost" id="btnLoadUrl">Carregar</button>
    </div>
    <p class="flyout-hint" id="metaInfo">Nenhum vídeo carregado</p>
  </div>

  <div class="flyout" id="flyoutAccount">
    <span class="flyout-title">Conta</span>
    <p class="flyout-hint" id="accountEmail"></p>
    <button class="btn btn-ghost" id="btnLogout">Sair</button>
  </div>

  <!-- ---------- palco ---------- -->
  <main class="stage">
    <div class="video-wrap" id="videoWrap">
      <div class="placeholder" id="placeholder">
        <span class="placeholder-icon">▸</span>
        <p>Entre numa sala e carregue o filme pra começar.</p>
      </div>
      <video id="player" controls playsinline style="display:none;"></video>
      <span class="lock-badge hidden" id="lockBadge">Controlado por quem está transmitindo</span>

      <div class="guest-requests hidden" id="guestRequests">
        <button class="request-btn" id="btnRequestPause" type="button" aria-label="Pedir pausa">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="5" width="3.5" height="14" rx="1"/><rect x="13.5" y="5" width="3.5" height="14" rx="1"/></svg>
        </button>
        <button class="request-btn" id="btnRequestPlay" type="button" aria-label="Pedir play">
          <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M8 5.5v13l11-6.5z"/></svg>
        </button>
      </div>

      <button class="fullscreen-btn hidden" id="btnFullscreen" type="button" aria-label="Tela cheia">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4H4v4"/><path d="M16 4h4v4"/><path d="M8 20H4v-4"/><path d="M16 20h4v-4"/></svg>
      </button>
    </div>
    <div class="video-status" id="videoStatus">
      <span id="driftInfo"></span>
      <span id="streamStatus"></span>
    </div>
  </main>

  <div class="toast" id="toast">
    <span id="toastText"></span>
    <div class="toast-actions">
      <button class="btn btn-primary" id="toastAction"></button>
      <button class="toast-dismiss" id="toastDismiss" type="button" aria-label="Dispensar">✕</button>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
